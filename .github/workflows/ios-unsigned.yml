# Builds the Expo app for iPhone on a GitHub macOS runner, WITHOUT code signing,
# and uploads tredder-<config>-unsigned.ipa as a workflow artifact.
# Install it from Windows with Sideloadly (or AltStore), which signs it with
# your Apple ID. See app/README.md "iPhone (sideload)".
#
# Run it by hand: GitHub -> Actions -> "iOS unsigned build" -> Run workflow.
# It is manual only because macOS minutes are expensive (10x on private repos).
name: iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Release = standalone app, opens by itself. Debug = development client (needs Metro on your PC)."
        type: choice
        options: [Release, Debug]
        default: Release
      simulator_test:
        description: "Instead of the .ipa: build for the iOS Simulator, launch it, and keep its log and crash report (to debug a crash on start)."
        type: boolean
        default: false
      project_files:
        description: "Instead of the .ipa: only generate the native iOS project (expo prebuild + CocoaPods) and upload the app/ios folder as a zip."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-unsigned
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.simulator_test && !inputs.project_files }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CONF: ${{ inputs.configuration }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the native iOS project (expo prebuild + CocoaPods)
        run: npx expo prebuild --platform ios --clean

      - name: Build (unsigned, for iPhone)
        run: |
          set -euo pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace $WS, scheme $SCHEME, configuration $CONF"
          xcodebuild -version
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration "$CONF" \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP=$(ls -d build/Build/Products/"$CONF"-iphoneos/*.app | head -1)
          if [ "$CONF" = Release ]; then
            # standalone: the JavaScript bundle must be inside the app, or it would need a dev server
            test -s "$APP/main.jsbundle" || { echo "::error::main.jsbundle missing from the Release app"; exit 1; }
            echo "embedded JS bundle: $(du -h "$APP/main.jsbundle" | cut -f1)"
          fi
          # every framework the app or its frameworks link to (@rpath) must be inside the app, or iOS
          # stops it at launch ("Library missing"), as a sideloaded build once did on the iPhone
          missing=0
          for bin in "$APP/$(basename "$APP" .app)" "$APP"/Frameworks/*.framework/*; do
            [ -f "$bin" ] && file "$bin" | grep -q Mach-O || continue
            chmod 755 "$bin"
            for lib in $(otool -L "$bin" | awk 'NR>1 && $1 ~ /^@rpath\// {print $1}'); do
              f="$APP/Frameworks/${lib#@rpath/}"
              [ -f "$f" ] || { echo "::error::$(basename "$bin") links $lib, not in the app"; missing=1; }
            done
          done
          [ "$missing" = 0 ]
          echo "frameworks in the app:"; ls "$APP/Frameworks"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "tredder-$CONF-unsigned.ipa" Payload
          ls -lh "tredder-$CONF-unsigned.ipa"
          shasum -a 256 "tredder-$CONF-unsigned.ipa" | tee "tredder-$CONF-unsigned.ipa.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: tredder-${{ inputs.configuration }}-unsigned-ipa
          path: |
            app/tredder-*-unsigned.ipa
            app/tredder-*-unsigned.ipa.sha256
          retention-days: 14
          if-no-files-found: error

  # Launch test: same app, built for the Simulator. A JavaScript error during start-up, which a
  # Release build turns into a crash, shows up in the log with its message.
  simulator:
    if: ${{ inputs.simulator_test && !inputs.project_files }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CONF: ${{ inputs.configuration }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the native iOS project (expo prebuild + CocoaPods)
        run: npx expo prebuild --platform ios --clean

      - name: Build for the Simulator
        run: |
          set -euo pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration "$CONF"             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'             -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Launch and watch for 40 s
        run: |
          set -uo pipefail
          APP=$(ls -d build/Build/Products/"$CONF"-iphonesimulator/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "app $APP, executable $EXE, bundle $BID, simulator $DEV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          mkdir -p sim-logs
          xcrun simctl spawn "$DEV" log stream --level debug --style compact --predicate "process == \"$EXE\"" > sim-logs/app.log 2>&1 &
          LOGPID=$!
          sleep 3
          xcrun simctl launch "$DEV" "$BID" | tee sim-logs/launch.txt
          sleep 40
          if xcrun simctl spawn "$DEV" launchctl list | grep -q "$BID"; then echo "RESULT: still running after 40 s" | tee sim-logs/result.txt; else echo "RESULT: NOT running (crashed or exited)" | tee sim-logs/result.txt; fi
          xcrun simctl io "$DEV" screenshot sim-logs/screen.png || true
          kill $LOGPID || true
          cp ~/Library/Logs/DiagnosticReports/*"$EXE"* sim-logs/ 2>/dev/null || true
          echo "---- errors in the app log ----"
          grep -iE "fatal|exception|error|abort|terminat|unhandled|TypeError|ReferenceError" sim-logs/app.log | grep -v "^Filtering" | head -80 || true
          ls -la sim-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tredder-simulator-test-logs
          path: app/sim-logs
          retention-days: 7

  # The generated Xcode project (app/ios), which Windows cannot produce: expo prebuild needs macOS or
  # Linux. Pods/ and build output are left out (pod install recreates Pods/ from Podfile.lock); the
  # project expects to sit in app/ next to node_modules, as it was generated.
  project:
    if: ${{ inputs.project_files }}
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the native iOS project (expo prebuild + CocoaPods)
        run: npx expo prebuild --platform ios --clean

      - name: Zip app/ios
        run: |
          set -euo pipefail
          test -f ios/Podfile.lock
          ls -d ios/*.xcworkspace ios/*.xcodeproj
          zip -qry tredder-ios-project.zip ios -x 'ios/Pods/*' 'ios/build/*'
          ls -lh tredder-ios-project.zip
          unzip -l tredder-ios-project.zip | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: tredder-ios-project
          path: app/tredder-ios-project.zip
          retention-days: 14
          if-no-files-found: error
