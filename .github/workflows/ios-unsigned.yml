# Builds the Expo app for iPhone on a GitHub macOS runner, WITHOUT code signing,
# and uploads tredder-<config>-unsigned.ipa as a workflow artifact.
# Install it from Windows with Sideloadly (or AltStore), which signs it with
# your Apple ID. See app/README.md "iPhone (sideload)".
#
# Run it by hand: GitHub -> Actions -> "iOS unsigned build" -> Run workflow.
# It is manual only because macOS minutes are expensive (10x on private repos).
name: iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Debug = development client (loads JavaScript from Metro on your PC). Release = standalone app."
        type: choice
        options: [Debug, Release]
        default: Debug

permissions:
  contents: read

concurrency:
  group: ios-unsigned
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CONF: ${{ inputs.configuration }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the native iOS project (expo prebuild + CocoaPods)
        run: npx expo prebuild --platform ios --clean

      - name: Build (unsigned, for iPhone)
        run: |
          set -euo pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace $WS, scheme $SCHEME, configuration $CONF"
          xcodebuild -version
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration "$CONF" \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP=$(ls -d build/Build/Products/"$CONF"-iphoneos/*.app | head -1)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "tredder-$CONF-unsigned.ipa" Payload
          ls -lh "tredder-$CONF-unsigned.ipa"
          shasum -a 256 "tredder-$CONF-unsigned.ipa" | tee "tredder-$CONF-unsigned.ipa.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: tredder-${{ inputs.configuration }}-unsigned-ipa
          path: |
            app/tredder-*-unsigned.ipa
            app/tredder-*-unsigned.ipa.sha256
          retention-days: 14
          if-no-files-found: error
